<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied · EduTrack</title>
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .unauth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 2rem; text-align:center; }
  .unauth-icon{
    width:72px; height:72px; border-radius:50%; background: var(--color-error-soft); color: var(--color-error);
    display:flex; align-items:center; justify-content:center; margin: 0 auto 1.25rem;
  }
  .unauth-icon .material-symbols-outlined{ font-size: 34px; }
</style>
</head>
<body>
  <div class="unauth-wrap">
    <div style="max-width:420px;">
      <div class="unauth-icon"><span class="material-symbols-outlined">block</span></div>
      <h1>Access denied</h1>
      <p>Your account role doesn't have permission to view that page. If you think this is a mistake, contact your school administrator.</p>
      <div style="display:flex;gap:.75rem;justify-content:center;margin-top:1.5rem;">
        <button class="btn btn-secondary" id="back-btn">Go back</button>
        <a href="login.html" class="btn btn-primary">Back to Login</a>
      </div>
    </div>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/router.js"></script>
  <script>
    document.getElementById('back-btn').addEventListener('click', () => {
      const session = Auth.getCurrentUser();
      if (session) Router.redirectToDashboardByRole(session.role);
      else window.location.href = 'login.html';
    });
  </script>
</body>
</html>
