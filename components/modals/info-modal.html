<!-- info-modal.html — reusable informational dialog markup pattern -->
<div class="modal-overlay" id="info-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Details</h3>
      <button class="modal-close" data-close-modal><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="info-modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-primary" data-close-modal>Close</button>
    </div>
  </div>
</div>
