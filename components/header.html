<!--
  header.html — static reference for the topbar markup.
  At runtime this exact structure is generated by assets/js/layout.js
  (see buildHeader()), which fills in the live user name/role/avatar.
  Kept here as a template for anyone wiring up a server-side include step.
-->
<header class="topbar">
  <div class="topbar-left">
    <button class="topbar-menu-btn icon-btn" id="topbar-menu-btn" aria-label="Open menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="topbar-title">Page Title</div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" aria-label="Notifications">
      <span class="material-symbols-outlined">notifications</span>
      <span class="badge-dot"></span>
    </button>
    <div class="user-menu">
      <button class="user-menu-btn" id="user-menu-btn">
        <div class="avatar">JD</div>
        <div class="user-meta">
          <div class="user-name">Jane Doe</div>
          <div class="user-role">Role</div>
        </div>
        <span class="material-symbols-outlined" style="font-size:18px;">expand_more</span>
      </button>
      <div class="user-dropdown hidden" id="user-dropdown">
        <a href="profile.html"><span class="material-symbols-outlined" style="font-size:18px;">person</span>My Profile</a>
        <a href="#"><span class="material-symbols-outlined" style="font-size:18px;">settings</span>Settings</a>
        <hr>
        <button class="danger" id="dropdown-logout-btn"><span class="material-symbols-outlined" style="font-size:18px;">logout</span>Log out</button>
      </div>
    </div>
  </div>
</header>
